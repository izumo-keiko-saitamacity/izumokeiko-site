<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>お問い合わせ｜出雲けいこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3DB56A; --text-green: #2C6B4E; --green-dark: #223B24;
    --ink: #22302A; --muted: #5A6B62; --paper: #FAFCF9; --line: #E1E9E2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; line-height:1.8; }
  .inner { max-width: 720px; margin:0 auto; padding: 0 20px; }
  .topbar { border-bottom:1px solid var(--line); padding:16px 0; }
  .topbar .inner { display:flex; align-items:center; justify-content:space-between; }
  .brand { font-family:"Zen Maru Gothic",sans-serif; font-weight:700; color:var(--ink); text-decoration:none; }
  .back { font-size:14px; color:var(--text-green); text-decoration:none; }
  main { padding: 72px 0; text-align:center; }
  main h1 { font-family:"Zen Maru Gothic",sans-serif; font-size:26px; color:var(--text-green); margin:0 0 14px; }
  main p { color:var(--muted); font-size:15px; }
  .badge { display:inline-block; background:#EEF1EA; color:#6B7A63; font-size:12px; font-weight:700; padding:4px 14px; border-radius:999px; margin-bottom:18px; }
</style>
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="brand" href="index.html">出雲けいこ</a>
  <a class="back" href="index.html">トップページへ戻る ＞</a>
</div></header>
<main class="inner">
  <span class="badge">準備中</span>
  <h1>お問い合わせ</h1>
  <p>お問い合わせ方法は、現在準備しています。</p>
</main>
</body>
</html>
