<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 仮公開ページなので検索エンジンには載せない。本番化するときにこの1行を消す -->
<meta name="robots" content="noindex">
<title>出雲けいこ｜テストページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3DB56A;      /* テーマカラー（明るいグリーン）。好みで変えてよい */
    --green-dark: #2A8A4E;
    --ink: #22302A;
    --paper: #FAFCF9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.8;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 48px 20px 40px;
  }
  .inner { max-width: 680px; margin: 0 auto; }
  header h1 {
    margin: 0 0 3px;
    font-size: 22px;
    font-weight: 700;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
  }
  header p.role { margin: 0; font-size: 14px; opacity: .9; }
  header p.tagline {
    margin: 0 0 20px;
    font-size: clamp(24px, 5.5vw, 34px);
    line-height: 1.5;
    font-weight: 900;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    text-wrap: balance;
  }
  main { padding: 36px 20px 48px; }
  main h2 { font-size: 18px; color: var(--green-dark); margin: 28px 0 8px; }
  main p  { margin: 0 0 16px; }
  footer {
    border-top: 3px solid var(--green);
    padding: 20px;
    font-size: 13px;
    color: #5A6B62;
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <p class="tagline">こころにっこり<br>ひとりで抱え込まなくていいまちへ</p>
    <h1>出雲けいこ</h1>
    <p class="role">さいたま市議会議員</p>
  </div>
</header>

<main>
  <div class="inner">

    <h2>このページについて</h2>
    <p>これは、ホームページを自分で公開・更新できるかを確かめるための仮のページです。</p>

    <h2>今日の練習</h2>
    <!-- ▼▼ 翌日の30分テストで直すのはこの1文。書き換えて、もう一度公開する ▼▼ -->
    <p>これは出雲けいこが自分で書き換えたテストです 一日目。</p>
    <!-- ▲▲ ここまで ▲▲ -->

    <h2>次にやること</h2>
    <p>この仕組みで公開・更新ができたら、次は議会活動の記録を載せていきます。</p>

  </div>
</main>

<footer>
  <div class="inner">
    出雲けいこ（仮公開・テスト中）
  </div>
</footer>

</body>
</html>
